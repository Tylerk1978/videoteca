  $("menu").innerHTML = `
    <h3>Copie automatiche</h3>
    <p>Ogni giorno, alla prima apertura, l'app salva da sola una copia dei dati e tiene le ultime ${SNAP_KEEP}. Servono a tornare indietro dopo un errore; le locandine e le foto non sono incluse (restano come sono). Non sostituiscono il backup: se perdi il telefono si perdono anche queste.</p>
    <div class="miss-list">${list.length ? list.map(s => `<button class="miss-row" data-snap="${esc(s.id)}"><b>${esc(snapLabel(s))}</b><span>${nFilm(snapCount(s.data))}</span></button>`).join("") : "<p>Nessuna copia ancora: la prima verrà fatta alla prossima apertura.</p>"}</div>
    <div class="err" id="snErr"></div>
    <div class="actions"><button class="btn ghost" id="snBack">Indietro</button></div>`;
  $("menuOv").hidden = false; $("menu").scrollTop = 0;
  $("snBack").onclick = () => openMenu();
  $("menu").querySelectorAll("[data-snap]").forEach(b => b.onclick = async () => {
    const s = list.find(x => x.id === b.dataset.snap); if (!s) return;
    if (!(await askConfirm("Ripristinare questa copia?", `I dati torneranno com'erano: ${snapLabel(s).toLowerCase()} (${nFilm(snapCount(s.data))}). Le modifiche fatte dopo andranno perse; prima di procedere salvo comunque una copia dello stato attuale.`, "Ripristina", true))) return;
    try {
      const now = new Date().toISOString();
      await snapPut({ id: "r" + Date.now(), at: now, data: snapCollect() });
      const keepMeta = getMeta();
      Object.keys(snapCollect()).forEach(k => localStorage.removeItem(k));
      Object.entries(s.data).forEach(([k, v]) => localStorage.setItem(k, v));
      const m = getMeta();
      for (const k of SNAP_KEEP_META) if (keepMeta[k] !== undefined) m[k] = keepMeta[k]; else delete m[k];
      m.lastChangeAt = now;
      localStorage.setItem(META_KEY, JSON.stringify(m));
      location.reload();
    } catch(e){ $("snErr").textContent = "Ripristino non riuscito."; }
  });
}
function applyTextScale(){ const s = Number(getMeta().textScale) || 100; document.documentElement.style.setProperty("--ts", String(s / 100)); }
function openTextSize(){
  const cur = Number(getMeta().textScale) || 100;
  $("menu").innerHTML = `
    <h3>Dimensione testo</h3>
    <p>Vale per il testo nelle schede dei film: trama, genere, cast, lingue e note.</p>
    <div class="tsval" id="tsVal">${cur}%</div>
    <div class="tsrow"><button type="button" class="btn ghost small" id="tsMinus" aria-label="Diminuisci">A−</button><input type="range" id="tsRange" min="80" max="150" step="5" value="${cur}" aria-label="Dimensione testo"><button type="button" class="btn ghost small" id="tsPlus" aria-label="Aumenta">A+</button></div>
    <div class="tsprev">Seguendo un tatuaggio sulla spalla di una ragazza, l'hacker Neo scopre che la «realtà» non è quella che sembra.</div>
    <div class="actions"><button type="button" class="btn ghost" id="tsReset">Normale</button><button type="button" class="btn" id="tsOk">Fatto</button></div>`;
  $("menuOv").hidden = false; $("menu").scrollTop = 0;
  const set = v => { v = Math.max(80, Math.min(150, Math.round(v / 5) * 5)); $("tsRange").value = v; $("tsVal").textContent = v + "%"; setMeta("textScale", v === 100 ? null : v); applyTextScale(); };
  $("tsRange").oninput = e => set(Number(e.target.value));
  $("tsMinus").onclick = () => set(Number($("tsRange").value) - 5);
  $("tsPlus").onclick = () => set(Number($("tsRange").value) + 5);
  $("tsReset").onclick = () => set(100);
  $("tsOk").onclick = () => { $("menuOv").hidden = true; };
}

/* ---------- Menu ---------- */
function openMenu(msg){
  const noCover = state.films.filter(d => !d.coverUrl && !d.coverLocal).length;
  $("menu").innerHTML = `
    <h3>Menu</h3>
    <p>I film sono salvati su questo dispositivo e funzionano anche offline.</p>
    <button class="item" id="mExport">Esporta backup<small>${nFilm(state.films.length)} in un file .json · ${esc(lastBackupText())}</small></button>
    <button class="item" id="mImport">Importa backup<small>Sostituisce la videoteca di questo dispositivo</small></button>
    <button class="item" id="mSnap">Ripristina una copia automatica<small>L'app salva da sola una copia al giorno e tiene le ultime 7</small></button>
    <button class="item" id="mPosters">Locandine mancanti<small>${noCover ? `${noCover === 1 ? "1 film senza locandina" : noCover + " film senza locandina"}: le cerco online` : "Tutti i film hanno la locandina"}</small></button>
    <button class="item" id="mPhotos">Foto di attori e registi<small>${(n => n ? `${plural(n, "persona", "persone")} con più foto da scegliere` : "Cerca online le foto che mancano")(Object.keys(getChoices()).length)}</small></button>
    <button class="item" id="mBios">Biografie di attori e registi<small>Scarica in un colpo le biografie che mancano</small></button>
    <button class="item" id="mTmdb">TMDB<small>${tmdbKey() ? "Collegato: le foto si cercano prima su TMDB" : "Inserisci la chiave gratuita per trovare le foto di quasi tutti gli attori"}</small></button>
    <button class="item" id="mText">Dimensione testo<small>Ingrandisci o rimpicciolisci il testo nelle schede dei film</small></button>
    <button class="item" id="mCsv">Esporta in Excel<small>File .csv con tutti i film, da aprire con Excel o Numbers</small></button>
    <div class="ok" id="mOk">${esc(msg || "")}</div><div class="err" id="mErr"></div>
    <div class="actions"><button class="btn ghost" id="mClose">Chiudi</button></div>
    <p style="text-align:center;font-size:12px;margin-top:14px">Versione ${APP_VERSION}</p>`;
  $("menuOv").hidden = false;
  $("mClose").onclick = () => { $("menuOv").hidden = true; };
  $("mExport").onclick = () => exportBackup();
  $("mImport").onclick = () => { $("importFile").value = ""; $("importFile").click(); };
  $("mSnap").onclick = openSnapshots;
  $("mPosters").onclick = openPostersMenu;
  $("mPhotos").onclick = openPersonPhotosMenu;
  $("mTmdb").onclick = openTmdb;
  $("mBios").onclick = openBiosMenu;
  $("mText").onclick = openTextSize;
  $("mCsv").onclick = async () => { $("mOk").textContent = await exportCSV(); };
}
function openTmdb(){
  const cur = tmdbKey();
  $("menu").innerHTML = `<h3>TMDB</h3>
    <p>The Movie Database ha le foto di quasi tutti gli attori e registi. Per usarlo serve una chiave personale gratuita, che resta solo su questo telefono e non finisce nel backup.</p>
    <p style="font-size:13px">Per crearla: registrati su <b>themoviedb.org</b> → icona del profilo → <b>Impostazioni</b> → <b>API</b> → <b>Crea</b> (tipo «Developer», uso personale). Poi copia qui la <b>Chiave API</b> (va bene anche il «Token di accesso in lettura»).</p>
    <input class="field" id="tmTok" placeholder="Incolla qui la chiave" value="${esc(cur)}" autocomplete="off" autocapitalize="off" spellcheck="false">
    <div class="err" id="tmErr"></div>
    <div class="actions">${cur ? `<button class="btn ghost" id="tmDel">Scollega</button>` : ""}<button class="btn ghost" id="tmNo">Annulla</button><button class="btn" id="tmYes">Salva</button></div>`;
  $("tmNo").onclick = () => openMenu();
  if (cur) $("tmDel").onclick = async () => { if (!(await askConfirm("Scollegare TMDB?", "Le foto già trovate restano; le nuove ricerche useranno solo Wikipedia e Wikidata.", "Scollega", true))) return; setMeta("tmdbKey", null); openMenu("TMDB scollegato."); };
  $("tmYes").onclick = async () => {
    const t = $("tmTok").value.trim().replace(/^Bearer\s+/i, ""); if (!t){ $("tmErr").textContent = "Incolla la chiave."; return; }
    $("tmErr").textContent = "";
    try { await tmdbGet("/configuration", t); setMeta("tmdbKey", t); openMenu("TMDB collegato: ora cerca le foto da «Foto di attori e registi»."); }
    catch(e){ if (!navigator.onLine){ setMeta("tmdbKey", t); openMenu("Chiave salvata: la verificherò alla prima ricerca."); } else $("tmErr").textContent = "La chiave non funziona: controlla di averla copiata tutta."; }
  };
}
$("menuBtn").onclick = () => openMenu();
$("menuOv").addEventListener("click", e => { if (e.target.id === "menuOv") $("menuOv").hidden = true; });
document.addEventListener("keydown", e => { if (e.key === "Escape"){ if (!$("cfOv").hidden) return $("cfNo").click(); $("formOv").hidden = true; $("detOv").hidden = true; $("menuOv").hidden = true; } });

/* ---------- Avvio ---------- */
$("credits").innerHTML = `<b>Videoteca</b><br>Versione ${APP_VERSION} · by Massimo Merigo`;
state.films = load();
fixNames().then(() => render()).catch(() => {});
state.mode = getMeta().viewMode === "cover" ? "cover" : "spine";
if (!getMeta().firstSeenAt) setMeta("firstSeenAt", new Date().toISOString());
applyTextScale();
showView((location.hash || "").slice(1), false);
snapDaily();
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible"){ snapDaily(); try { $("homeBanner").innerHTML = bannerHTML(); } catch(e){} } });
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e){}
if ("serviceWorker" in navigator && location.protocol !== "file:") window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
})();
</script>
