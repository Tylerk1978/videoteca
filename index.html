<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16120f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Videoteca">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>Videoteca</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --wall:#16120f; --ink:#f3ead8; --muted:#b5a487; --line:#4a3d2e; --field:#2a221a; --accent:#d9a65a;
  --row:200px; --plank:16px; --s:1;
}
@media (max-width:640px){ :root{ --row:170px; --plank:13px; --s:.86; } }
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;color:var(--ink);font-family:Inter,system-ui,sans-serif;background:radial-gradient(ellipse at 50% -20%, #33281e 0%, transparent 60%), var(--wall);-webkit-font-smoothing:antialiased}
button{font-family:inherit}
[hidden]{display:none !important}
header{max-width:1100px;margin:0 auto;padding:calc(26px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right)) 6px calc(20px + env(safe-area-inset-left));display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.htitle{display:flex;align-items:center;gap:12px;min-width:0}
h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:clamp(30px,7vw,44px);margin:0;line-height:1;cursor:pointer}
.sub{color:var(--muted);font-size:14px;margin-top:6px}
.hbtns{display:flex;gap:8px;align-items:center}
.iconbtn{width:42px;height:42px;border-radius:999px;border:1px solid #5d4c39;background:transparent;color:var(--ink);font-size:20px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.iconbtn.back{font-size:28px;padding-bottom:3px}
.btn{appearance:none;border:0;border-radius:999px;padding:11px 18px;font-weight:600;font-size:14px;cursor:pointer;background:var(--accent);color:#2a1d0f;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid #5d4c39}
.btn.danger{background:#9e3a2e;color:#fff}
.btn.small{padding:8px 13px;font-size:13px}
.btn:disabled{opacity:.5}
.linkbtn{background:none;border:0;color:var(--accent);font:600 14px Inter,sans-serif;cursor:pointer;padding:4px}
.field{background:var(--field);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:11px 14px;font:15px Inter,sans-serif;outline:none;width:100%}
.field:focus{border-color:var(--accent)}
textarea.field{resize:vertical;line-height:1.5}

/* Home */
.home{max-width:1100px;margin:0 auto;padding:18px calc(20px + env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left));display:flex;flex-direction:column;gap:16px;min-height:calc(100dvh - 110px - env(safe-area-inset-top))}
.card{display:flex;align-items:center;gap:16px;width:100%;text-align:left;background:linear-gradient(180deg,#271f17,#1e1812);border:1px solid #4a3d2e;border-radius:20px;padding:18px;color:var(--ink);cursor:pointer;box-shadow:0 12px 30px rgba(0,0,0,.35)}
.card:hover{border-color:var(--accent)}
.card-art{flex:0 0 auto;width:120px;height:96px;border-radius:10px;background:#100c09;display:flex;align-items:flex-end;gap:1px;padding:0 8px;position:relative;overflow:hidden;border-bottom:8px solid #7a5230}
.card-art .spine{cursor:default}
.card-art .spine .txt{display:none}
.card-body{flex:1;min-width:0;overflow:hidden}
.card-title{font-family:"Cormorant Garamond",Georgia,serif;font-size:30px;font-weight:600;line-height:1;white-space:nowrap}
.card-sub{color:var(--muted);font-size:14px;margin-top:6px}
.chev{font-size:30px;color:var(--muted);flex:0 0 auto}
.card-art .disc{position:absolute;right:-14px;bottom:-12px;width:74px;height:74px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.6))}
@media (max-width:420px){ .card{gap:12px;padding:16px 14px} .card-art{width:96px;height:84px} .chev{font-size:26px} }
.credits{text-align:center;color:#8e7c62;font-size:12px;line-height:1.6;margin-top:auto;padding-top:24px}
/* Pagina iniziale ferma, a tutto schermo, con i crediti in fondo */
html.homeview,html.homeview body{height:100%;overflow:hidden;overscroll-behavior:none}
html.homeview body{position:fixed;inset:0;width:100%;display:flex;flex-direction:column;min-height:0}
html.homeview header{flex:0 0 auto;width:100%;box-sizing:border-box}
html.homeview .home{flex:1 1 auto;min-height:0;width:100%;box-sizing:border-box;overflow-y:auto;overscroll-behavior:contain;padding-bottom:max(4px, calc(env(safe-area-inset-bottom) - 18px))}
html.homeview .credits{padding-top:12px;line-height:1.45}
@media (max-height:900px){ html.homeview .home{gap:10px;padding-top:10px} html.homeview .card{padding:12px 14px} html.homeview .card-art{height:72px} html.homeview .card-art .disc{width:60px;height:60px} }
@media (max-height:700px){ html.homeview .home{gap:8px;padding-top:6px} html.homeview .card{padding:9px 12px} html.homeview .card-art{height:58px;width:84px} html.homeview .card-title{font-size:24px} html.homeview .credits{padding-top:6px;line-height:1.4} }
.credits b{font-family:"Cormorant Garamond",Georgia,serif;font-size:16px;font-weight:600;color:var(--muted)}
.banner{display:flex;align-items:center;gap:14px;justify-content:space-between;flex-wrap:wrap;background:#3a2a17;border:1px solid #8a6a3a;border-radius:16px;padding:14px 16px}
.banner b{display:block;font-size:15px}
.banner span{display:block;color:#e6cfa6;font-size:13px;margin-top:3px}
.banner-acts{display:flex;gap:8px;margin-left:auto}
#homeBanner:empty{display:none}

/* Controls */
.wrap{max-width:1100px;margin:0 auto;padding:4px calc(20px + env(safe-area-inset-right)) calc(90px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left))}
.controls{display:flex;gap:10px;flex-wrap:wrap;padding:10px 0 4px}
.controls .search{flex:1 1 240px;position:relative}
.controls .search input{padding-left:38px}
.controls .search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);opacity:.6}
.controls .search{flex:1 1 100%}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.filters select{min-width:0}
.clearf{background:transparent;border:1px solid #5d4c39;color:var(--ink);border-radius:12px;padding:11px 14px;font:600 15px Inter,sans-serif;cursor:pointer}
.clearf:disabled{opacity:.4;cursor:default}
.letters{display:flex;flex-wrap:wrap;gap:4px;padding:8px 0 4px}
.letters button{min-width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;padding:0 6px}
.letters button:disabled{opacity:.25;cursor:default}
.sechead{display:flex;align-items:baseline;gap:12px;margin:22px 4px 10px}
.sechead h2{font-family:"Cormorant Garamond",Georgia,serif;font-size:30px;margin:0;font-weight:600}
.sechead span{color:var(--muted);font-size:14px}
.nores{color:var(--muted);text-align:center;margin:50px 0;font-family:"Cormorant Garamond",Georgia,serif;font-size:22px;font-style:italic}

/* Scaffale */
.case{position:relative;border-radius:6px;padding:14px 16px 0;border:14px solid #4e321c;border-bottom-width:0;border-image:linear-gradient(180deg,#6e4524,#4e321c 40%,#3d2716) 14;background:linear-gradient(90deg, rgba(0,0,0,.55), transparent 7%, transparent 93%, rgba(0,0,0,.55)),#110d0a;box-shadow:0 20px 40px rgba(0,0,0,.45)}
.case::after{content:"";position:absolute;left:-14px;right:-14px;bottom:-18px;height:18px;background:linear-gradient(180deg,#5e3b1f,#352010);border-radius:0 0 4px 4px}
.shelf + .shelf{margin-top:0}
.shelf{display:flex;flex-wrap:wrap;column-gap:1px;row-gap:var(--plank);padding-bottom:var(--plank);margin:0 -16px;padding-left:16px;padding-right:16px;
  background-image:repeating-linear-gradient(180deg,transparent 0,transparent var(--row),#94653a var(--row),#7a5230 calc(var(--row) + var(--plank)*.45),#553519 calc(var(--row) + var(--plank))),
  repeating-linear-gradient(180deg,rgba(0,0,0,.55) 0,rgba(0,0,0,0) 16px,transparent var(--row),transparent calc(var(--row) + var(--plank)));
  background-position:0 0,0 calc(var(--row) + var(--plank))}
.slot{height:var(--row);display:flex;align-items:flex-end}
.empty-row{height:var(--row);display:flex;align-items:center;justify-content:center;width:100%;color:#8e7c62;font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:19px;text-align:center;padding:0 20px}
.spine{position:relative;width:calc(28px * var(--s));height:calc(var(--row) * .93);background:var(--c);color:var(--t);border-radius:2px;cursor:pointer;display:flex;align-items:center;justify-content:center;overflow:hidden;border:0;padding:8px 0;
  box-shadow:inset 2px 0 2px rgba(255,255,255,.12), inset -3px 0 4px rgba(0,0,0,.4), 1px 0 2px rgba(0,0,0,.5);transition:transform .2s, filter .2s}
.spine::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:rgba(0,0,0,.25)}
.spine:hover,.spine:focus-visible{transform:translateY(-6px);filter:brightness(1.1);outline:none}
.spine .txt{writing-mode:vertical-rl;transform:rotate(180deg);display:block;max-height:100%;max-width:100%;white-space:normal;text-align:center;line-height:1.05;font-size:calc(9px * var(--s) + 1.5px);overflow:hidden;overflow-wrap:anywhere}
.spine .ar{display:block;font-size:1em;letter-spacing:.3px;text-transform:uppercase;font-weight:700;margin-left:2px}
.spine .al{display:block;font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:.85em;opacity:.9}
.spine.new{animation:drop .7s cubic-bezier(.2,.9,.3,1.2)}
@keyframes drop{from{transform:translateY(-60px);opacity:0}to{transform:none;opacity:1}}
.divider{position:relative;width:calc(22px * var(--s));height:calc(var(--row) * .98);background:linear-gradient(90deg,#d8c9a8,#c4b48f);border-radius:3px 3px 1px 1px;box-shadow:1px 0 3px rgba(0,0,0,.5);display:flex;justify-content:center;padding-top:6px;margin:0 2px}
.divider b{font-family:"Cormorant Garamond",Georgia,serif;font-size:calc(17px * var(--s) + 2px);color:#2a1d0f;font-weight:700}

/* Overlay */
.overlay{position:fixed;inset:0;background:rgba(10,7,4,.7);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.sheet{background:#211a14;border:1px solid #4a3d2e;border-radius:18px;width:100%;max-width:520px;max-height:calc(100vh - 40px);overflow:auto;padding:22px}
@media (max-width:640px){
  .overlay{align-items:flex-end;padding:0}
  .sheet{border-radius:18px 18px 0 0;max-height:92vh;padding-bottom:calc(22px + env(safe-area-inset-bottom))}
  #detOv{align-items:stretch}
  #detOv .sheet{border-radius:0;max-height:none;height:100%;padding-top:calc(18px + env(safe-area-inset-top));border:0}
}
.sheet h3{font-family:"Cormorant Garamond",Georgia,serif;font-size:28px;font-weight:600;margin:0 0 14px;line-height:1.1}
.sheet label{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px}
.sheet p{color:var(--muted);line-height:1.5;font-size:14px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.err{color:#e08a7c;font-size:13px;margin-top:10px}
.err:empty{display:none}
.ok{color:#9fc79a;font-size:13px;margin-top:10px}
.ok:empty{display:none}
.hint{color:var(--muted);font-size:13px;margin-top:8px}
.hint:empty{display:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.swatches button{width:30px;height:30px;border-radius:8px;border:2px solid transparent;cursor:pointer}
.swatches button.on{border-color:var(--ink)}
.swatches .auto{width:auto;padding:0 10px;background:var(--field);color:var(--muted);font-size:12px;border:1px solid var(--line)}
.swatches .auto.on{border:2px solid var(--ink);color:var(--ink)}
.vbox{white-space:normal!important;text-align:left!important}
.vbox .vnum{font-family:"Cormorant Garamond",Georgia,serif;font-size:38px;font-weight:600;color:var(--accent);line-height:1.05}
.vbox .vsub{color:var(--muted);font-size:12.5px;margin-top:4px}
.vbox .vpress{color:var(--ink);font-size:12.5px;margin-top:8px}
.vbox .vbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.vbox .vbtns.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vbox .vbtns.grid2 > .btn{width:100%;margin:0;display:flex;align-items:center;justify-content:center;text-align:center;box-sizing:border-box;min-height:40px}
.vbox select.field{padding:7px 32px 7px 10px;font-size:13px;width:auto;margin-top:8px}
.dgres{display:flex;gap:12px;align-items:center;width:100%;text-align:left;appearance:none;background:var(--field);border:1px solid var(--line);border-radius:12px;padding:8px;margin-top:8px;color:var(--ink);cursor:pointer;font:13px Inter,sans-serif}
.dgres:hover{border-color:var(--accent)}
.dgres img,.dgres .noimg{width:56px;height:56px;border-radius:6px;object-fit:cover;flex:0 0 56px;background:#14100c}
.dgres b{display:block;font-size:14px;margin-bottom:3px}
.dgres span{display:block;color:var(--muted);font-size:12px;line-height:1.4}
.vlist .grp-item{display:flex;justify-content:space-between;gap:10px;align-items:center}
.vlist .grp-item .vv{color:var(--accent);font-weight:600;white-space:nowrap}
.acwrap{position:relative}
.acbtn{position:absolute;right:4px;top:50%;transform:translateY(-50%);appearance:none;background:none;border:0;color:var(--muted);font-size:16px;width:38px;height:38px;cursor:pointer}
.acbox{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:5;background:#2a221a;border:1px solid var(--accent);border-radius:12px;max-height:240px;overflow:auto;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.acbox button{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;appearance:none;background:none;border:0;border-bottom:1px solid #3d3226;color:var(--ink);font:15px Inter,sans-serif;padding:11px 14px;cursor:pointer}
.acbox button:last-child{border-bottom:0}
.acbox button small{color:var(--muted);font-size:12px;white-space:nowrap}
.acbox button:hover,.acbox button.hl{background:#3a2d1f}
.acbox .acnone{padding:11px 14px;color:var(--muted);font-size:13px}
.gsel{display:flex;flex-wrap:wrap;gap:6px;min-height:4px}
.gsel span{display:inline-flex;align-items:center;gap:4px;background:#5a3f1f;border:1px solid var(--accent);color:var(--ink);border-radius:999px;padding:5px 6px 5px 12px;font-size:13px}
.gsel span button{appearance:none;background:none;border:0;color:var(--muted);font-size:17px;line-height:1;padding:0 4px;cursor:pointer}
select.field{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.glist{margin-top:14px;border-top:1px solid var(--line)}
.grow2{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.grow2 .gn{flex:1;min-width:0;font-size:15px}
.grow2 .gn small{color:var(--muted);font-size:12px;margin-left:6px}
.grow2 .field{flex:1;min-width:0;padding:8px 10px}
.tagpick{display:flex;flex-wrap:wrap;gap:6px}
.tagpick button{background:var(--field);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.tagpick button.on{background:#5a3f1f;border-color:var(--accent);color:var(--ink)}
.fcover{display:flex;gap:14px;align-items:flex-start}
.fcover-prev{flex:0 0 auto;width:110px;height:110px;border-radius:4px;background:#100c09;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 6px 14px rgba(0,0,0,.5)}
.fcover-prev img{width:100%;height:100%;object-fit:cover}
.fcover-acts{flex:1;display:flex;flex-direction:column;gap:8px}
.fcover-acts .btn{width:100%}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;margin-top:10px}
.picks button{padding:0;border:2px solid transparent;border-radius:6px;background:#2a221a;cursor:pointer;overflow:hidden;text-align:left;color:var(--ink)}
.picks button:hover{border-color:var(--accent)}
.picks img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.picks small{display:block;font-size:10px;line-height:1.25;padding:4px 5px;color:var(--muted);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

/* Scheda disco */
.dtop{display:flex;gap:16px;align-items:flex-start}
.dcover{flex:0 0 auto;width:190px;height:190px;border-radius:4px;background:#100c09;overflow:hidden;box-shadow:0 10px 24px rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center}
.dcover img{width:100%;height:100%;object-fit:cover;display:block}
@media (max-width:420px){ .dcover{width:155px;height:155px} }
.dinfo{min-width:0}
.dinfo .art{background:none;border:0;padding:0;cursor:pointer;font:inherit;color:var(--muted);font-size:16px;text-align:left;text-decoration:underline;text-decoration-color:rgba(217,166,90,.45);text-underline-offset:4px}
.dinfo .yr{color:var(--muted);font-size:calc(14px * var(--ts, 1));margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.sortseg{display:inline-flex;background:var(--field);border:1px solid var(--line);border-radius:999px;padding:3px;margin:6px 0 2px}
.sortseg button{appearance:none;border:0;background:none;color:var(--muted);font:600 13px Inter,sans-serif;padding:7px 14px;border-radius:999px;cursor:pointer}
.sortseg button.on{background:var(--accent);color:#2a1d0f}
.chip{background:var(--field);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px;color:var(--muted)}
.chip.tag{background:#3a2a17;border-color:#8a6a3a;color:#e6cfa6;cursor:pointer;font-size:11px;padding:3px 9px}
.chip.vin{display:inline-flex;align-items:center;gap:6px}
.chip.vin i{width:10px;height:10px;border-radius:50%;background:var(--vc);border:1px solid rgba(255,255,255,.3)}
.dsec{margin-top:20px}
.dsec h4{font-size:calc(12px * var(--ts, 1));color:var(--muted);font-weight:500;margin:0 0 6px}
.dsec .box{background:var(--field);border-radius:12px;padding:10px 13px;font-size:calc(11.5px * var(--ts, 1));line-height:1.5;white-space:pre-wrap;text-align:justify}
.tracks{margin:0;padding:9px 13px 9px 36px;background:var(--field);border-radius:12px;font-size:calc(11.5px * var(--ts, 1));line-height:1.6}
.tracks li::marker{color:var(--muted);font-size:calc(11px * var(--ts, 1))}
.tracks li.side{list-style:none;margin-left:-24px;color:var(--accent);font-weight:600;font-size:12px;letter-spacing:.5px;text-transform:uppercase;margin-top:6px}
.bigact{width:100%;margin-top:16px}
.menu .item{display:block;width:100%;text-align:left;background:var(--field);border:1px solid var(--line);color:var(--ink);border-radius:14px;padding:14px 16px;margin-top:10px;cursor:pointer;font-size:15px;font-weight:600}
.menu .item small{display:block;color:var(--muted);font-weight:400;font-size:13px;margin-top:3px}
.welcome{max-width:460px;margin:40px auto;text-align:center;background:#211a14;border:1px solid #4a3d2e;border-radius:18px;padding:26px 22px}
.welcome h2{font-family:"Cormorant Garamond",Georgia,serif;font-size:28px;margin:0 0 8px;font-weight:600}
.welcome p{color:var(--muted);line-height:1.5;margin:0 0 18px;font-size:15px}
.welcome .actions{justify-content:center}
.linkbtn.add{margin-left:auto;text-decoration:none}
.scanner{position:fixed;inset:0;z-index:50;background:#000;display:flex;flex-direction:column}
.scanner video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scan-frame{position:absolute;left:8%;right:8%;top:32%;height:22%;border:3px solid var(--accent);border-radius:14px;box-shadow:0 0 0 2000px rgba(0,0,0,.45)}
.scan-frame i{position:absolute;left:6%;right:6%;top:50%;height:2px;background:#e05a4a;box-shadow:0 0 8px #e05a4a;animation:scanline 1.6s ease-in-out infinite}
@keyframes scanline{0%,100%{transform:translateY(-36px)}50%{transform:translateY(36px)}}
.scan-top{position:absolute;top:calc(20px + env(safe-area-inset-top));left:0;right:0;text-align:center;color:#fff;font-size:15px;font-weight:600;padding:0 24px;text-shadow:0 1px 4px #000}
.scan-bottom{position:absolute;left:0;right:0;bottom:0;padding:16px 18px calc(20px + env(safe-area-inset-bottom));background:linear-gradient(180deg,transparent,rgba(0,0,0,.85) 30%)}
.scan-msg{color:#fff;text-align:center;font-size:14px;min-height:20px;margin-bottom:10px}
.scan-manual{display:flex;gap:8px}
.viewtoggle{display:inline-flex;background:var(--field);border:1px solid var(--line);border-radius:999px;padding:3px;margin-top:6px}
.viewtoggle button{background:none;border:0;color:var(--muted);font-size:13px;font-weight:600;padding:7px 16px;border-radius:999px;cursor:pointer}
.viewtoggle button.on{background:var(--ink);color:#231b13}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:14px 12px}
.cletter{grid-column:1/-1;font-family:"Cormorant Garamond",Georgia,serif;font-size:28px;font-weight:700;color:var(--accent);border-bottom:1px solid #3d3226;padding-bottom:2px;margin-top:10px}
.citem{background:none;border:0;padding:0;color:var(--ink);text-align:left;cursor:pointer;font:inherit;min-width:0}
.citem .cimg{position:relative;width:100%;aspect-ratio:1;border-radius:3px;background:#100c09;overflow:hidden;box-shadow:0 6px 14px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center}
.citem .cimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.citem .cimg .ph{font-family:"Cormorant Garamond",Georgia,serif;font-size:13px;font-weight:700;text-align:center;padding:8px;color:var(--t);background:var(--c);width:100%;height:100%;display:flex;align-items:center;justify-content:center;line-height:1.15}
.citem b{display:block;font-size:12px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.citem span{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-art.pie{padding:0;border-bottom:0;align-items:center;justify-content:center}
.card-art.bars{gap:6px;padding:10px 12px 0;align-items:flex-end;border-bottom:0}
.card-art.bars i{flex:1;background:var(--accent);border-radius:4px 4px 0 0;opacity:.9;min-height:4px}
.backlink{background:none;border:0;color:var(--accent);font:600 15px Inter,sans-serif;cursor:pointer;padding:6px 0;display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.apage h2{font-family:"Cormorant Garamond",Georgia,serif;font-size:30px;font-weight:600;margin:22px 4px 8px}
.apage .meta{color:var(--muted);font-size:14px;margin:0 4px 6px}
.drow{display:flex;gap:12px;align-items:center;width:100%;background:var(--field);border:1px solid var(--line);border-radius:12px;padding:8px;margin-bottom:8px;color:var(--ink);cursor:pointer;text-align:left;font:inherit}
.drow .th{flex:0 0 auto;width:54px;height:54px;border-radius:3px;overflow:hidden;background:#100c09;display:flex;align-items:center;justify-content:center}
.drow .th img{width:100%;height:100%;object-fit:cover}
.drow b{display:block;font-size:14px}
.drow .rinfo{flex:1;min-width:0}
.drow .rstars{flex:0 0 auto;color:var(--accent);font-size:13px;letter-spacing:1px;padding-right:4px;white-space:nowrap}
.drow .rstars .sg{display:inline}
.sg{background:linear-gradient(90deg,var(--accent) var(--f),#5d4c39 var(--f));-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.stars{display:flex;align-items:center;gap:2px}
.stars .star{position:relative;display:inline-block;font-size:30px;line-height:1;width:1em;text-align:center}
.stars .star button{position:absolute;top:0;bottom:0;width:50%;background:none;border:0;padding:0;cursor:pointer}
.stars .star button.l{left:0}.stars .star button.r{right:0}
.stars .val{margin-left:10px;color:var(--muted);font-size:14px;min-width:30px}
.drow span{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.aphoto-wrap{display:flex;flex-direction:column;align-items:center;margin:24px 0 4px}
.aphoto{width:96%;height:auto;aspect-ratio:3/2;border-radius:14px;border:1px dashed #6b5132;background:#1d1711;color:var(--muted);padding:0;overflow:hidden;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px rgba(0,0,0,.4);font-size:13px;line-height:1.6}
.aphoto.has{border:0}
.aphoto img{width:100%;height:100%;object-fit:cover}
.aphoto-acts{display:flex;gap:22px;margin-top:10px}
.pgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:12px 0;max-height:55vh;overflow:auto}
.pgrid button{padding:0;border:1px solid #5d4c39;border-radius:12px;overflow:hidden;background:#1d1711;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;text-align:left}
.pgrid img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.pgrid span{font-size:11px;padding:6px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.infoarea{min-height:140px;font-size:12.5px;text-align:justify;overflow:hidden;resize:none}
.saved{color:var(--muted);font-size:12px;height:16px;margin-top:4px;text-align:right}
.stat-hero{background:linear-gradient(180deg,#271f17,#1e1812);border:1px solid #4a3d2e;border-radius:20px;padding:22px;text-align:center;margin-top:10px}
.stat-hero .num{font-family:"Cormorant Garamond",Georgia,serif;font-size:72px;font-weight:600;line-height:1;color:var(--accent)}
.stat-hero .lbl{color:var(--muted);font-size:15px;margin-top:6px}
.stat-mini{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.stat-mini div{background:var(--field);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center;color:var(--muted);font-size:13px}
.stat-mini b{display:block;font-family:"Cormorant Garamond",Georgia,serif;font-size:30px;color:var(--ink)}
.subcard{display:flex;align-items:center;gap:10px;width:100%;background:linear-gradient(180deg,#271f17,#1e1812);border:1px solid #4a3d2e;border-radius:16px;padding:14px;color:var(--ink);cursor:pointer;font:inherit;margin-bottom:10px;text-align:left}
.subcard .t{flex:1;font-family:"Cormorant Garamond",Georgia,serif;font-size:22px;font-weight:600}
.subcard .s{color:var(--muted);font-size:13px}
.grp{margin-bottom:8px}
.grow{display:grid;grid-template-columns:minmax(0,140px) 1fr 40px;gap:12px;align-items:center;width:100%;padding:11px 14px;background:#211a14;border:1px solid #3d3226;border-radius:14px;color:var(--ink);cursor:pointer;font:inherit;text-align:left}
.grow .y{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grow .track{height:10px;background:#100c09;border-radius:99px;overflow:hidden}
.grow .fill{display:block;height:100%;background:linear-gradient(90deg,#b8843f,var(--accent));border-radius:99px}
.grow .n{text-align:right;font-weight:600}
.grp.open .grow{border-color:var(--accent);border-radius:14px 14px 0 0}
.grp-list{background:#1a1410;border:1px solid var(--accent);border-top:0;border-radius:0 0 14px 14px;padding:4px 12px 10px}
.grp-item{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid #3d3226;padding:9px 2px;color:var(--ink);cursor:pointer;font:inherit}
.grp-item b{display:block;font-size:13.5px}
.grp-item span{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.note{color:var(--muted);font-size:13px;margin:0 4px 12px}
.miss-list{margin-top:12px}
.miss-row{display:block;width:100%;text-align:left;background:var(--field);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:6px;color:var(--ink);cursor:pointer;font:inherit}
.miss-row b{display:block;font-size:14px;font-weight:600}
.miss-row span{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.flash{animation:flash 1.8s ease-out}
@keyframes flash{0%,35%{box-shadow:0 0 0 3px var(--accent),0 0 18px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
.crit{margin:10px 0 0;padding-left:20px;font-size:14px;line-height:1.5}
.crit li{margin-bottom:10px}
.crit b{color:var(--ink)}
.rlist{display:flex;flex-direction:column;gap:3px}
.rrow.newday{margin-top:11px}
.rrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:linear-gradient(180deg,#271f17,#1e1812);border:1px solid #4a3d2e;border-radius:10px;padding:5px 10px 5px 6px;color:var(--ink);cursor:pointer;font:inherit}
.rrow.past{opacity:.55}
.rrow .rdate{flex:0 0 74px;width:74px;box-sizing:border-box;overflow:hidden;display:flex;align-items:baseline;justify-content:center;gap:4px;background:#100c09;border-radius:7px;padding:4px 4px;border-bottom:2px solid #9e5a2e;white-space:nowrap}
.rrow .rdate b{font:700 16px Georgia,serif;color:var(--accent);line-height:1.1}
.rrow .rdate span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.rrow .rtxt{flex:1;min-width:0;line-height:1.2}
.rrow .rtxt b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rrow .rtxt span{display:block;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rrow .chev{font-size:18px;color:var(--muted)}
.tsrow{display:flex;align-items:center;gap:10px;margin-top:14px}
.tsrow input[type=range]{flex:1;accent-color:var(--accent);height:28px}
.tsrow .btn{min-width:46px;padding:8px 0}
.tsval{text-align:center;font:600 22px Georgia,serif;color:var(--accent);margin-top:10px}
.tsprev{margin-top:12px;background:var(--field);border-radius:12px;padding:10px 13px;font-size:calc(11.5px * var(--ts, 1));line-height:1.5}
.dgplist{display:flex;flex-direction:column;gap:6px;max-height:46vh;overflow-y:auto}
.dgp{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--field);border:1px solid var(--line);border-radius:12px;padding:8px;color:var(--ink);font:inherit;cursor:pointer}
.dgp img,.dgp .ph{width:46px;height:46px;border-radius:6px;object-fit:cover;flex:0 0 46px;background:#100c09}
.dgp b{display:block;font-size:13px;line-height:1.3}
.dgp small{display:block;font-size:11.5px;color:var(--ink);opacity:.85;margin-top:2px;line-height:1.35}
.vstars{white-space:nowrap;letter-spacing:1px;font-size:16px}
/* ---------- Videoteca: costine Blu-ray, locandine verticali ---------- */
/* Custodia Blu-ray: plastica traslucida, fascia in testa, titolo condensato, anno in fondo */
.spine{--case:#2f72cc;--band:calc(var(--row) * .105);--foot:calc(var(--row) * .12);width:calc(19px * var(--s) + 2px);height:calc(var(--row) * .95);border-radius:3px;
  padding:calc(var(--band) + 6px) 0 calc(var(--foot) + 5px);
  background:linear-gradient(90deg,rgba(255,255,255,.13),rgba(255,255,255,0) 28%,rgba(0,0,0,0) 62%,rgba(0,0,0,.3)),var(--c);
  border:calc(1.5px * var(--s) + .5px) solid var(--case);
  box-shadow:inset 0 0 0 .5px rgba(0,0,0,.35),1px 0 2px rgba(0,0,0,.55)}
.spine.f-k4,.spine.f-dvd{--case:#0c0c0c}
.spine::before{display:none}
.spine::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:2px;
  background:linear-gradient(90deg,rgba(255,255,255,.38) 0,rgba(255,255,255,.08) 1.5px,transparent 3px,transparent 78%,rgba(255,255,255,.12) 88%,transparent),
  linear-gradient(180deg,rgba(255,255,255,.10),transparent 8%,transparent 92%,rgba(0,0,0,.18))}
.spine .band{position:absolute;top:0;left:0;right:0;height:var(--band);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;
  font:italic 800 calc(7px * var(--s) + 1.5px)/1 Inter,sans-serif;letter-spacing:-.2px;color:#fff;
  background:linear-gradient(180deg,#3d8ff0,#1559b8 60%,#0d4596);border-bottom:1px solid rgba(255,255,255,.75)}
.spine .band i{display:block;font:700 calc(3px * var(--s) + 1.5px)/1 Inter,sans-serif;letter-spacing:.1px;margin-top:1px;font-style:normal;opacity:.9}
.spine.f-k4 .band{background:linear-gradient(180deg,#2b2b2b,#000);color:#f2f2f2;border-bottom-color:#c9a64a}
.spine.f-dvd .band{background:linear-gradient(180deg,#1c1c1c,#000);color:#e8e8e8;border-bottom-color:#777;font-style:normal}
.spine .txt{font-size:calc(10px * var(--s) + 1.5px)}
.spine .ar{font-family:Oswald,"Arial Narrow",Inter,sans-serif;font-weight:600;letter-spacing:.4px;text-transform:uppercase;margin:0}
.spine .foot{position:absolute;left:0;right:0;bottom:0;height:var(--foot);display:flex;align-items:center;justify-content:center;border-top:1px solid color-mix(in srgb,var(--t) 35%,transparent);background:rgba(0,0,0,.14)}
.spine .foot span{writing-mode:vertical-rl;transform:rotate(180deg);font:600 calc(6px * var(--s) + 1.5px)/1 Inter,sans-serif;letter-spacing:.3px;color:var(--t);opacity:.85}
.slot{padding:0 .5px}
.card-art .band,.card-art .foot span{font-size:0}.card-art .band i{display:none}.card-art .spine{border-width:1px}
.card-art .disc{right:-12px;bottom:-12px}
.cgrid{grid-template-columns:repeat(auto-fill,minmax(100px,1fr))}
.citem .cimg{aspect-ratio:2/3}
.citem .cimg .ph{font-size:14px;padding:10px}
.dcover{width:150px;height:225px}
@media (max-width:420px){ .dcover{width:128px;height:192px} }
.dinfo .art{font-size:inherit;color:var(--ink)}
.dinfo .otitle{color:var(--muted);font-style:italic;font-size:14px;margin-bottom:4px}
.fcover-prev{width:100px;height:150px}
.picks{grid-template-columns:repeat(auto-fill,minmax(84px,1fr))}
.picks img{aspect-ratio:2/3}
.drow .th{width:40px;height:60px}
.aphoto{width:72%;aspect-ratio:4/5}
.pgrid img{aspect-ratio:4/5}
.links{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.links .btn{text-decoration:none}
.box.cast{white-space:normal;text-align:left;padding:6px 13px}
.cline{display:flex;justify-content:space-between;gap:12px;padding:4px 0;border-bottom:1px solid #3d3226}
.cline:last-child{border-bottom:0}
.cline span{color:var(--muted);text-align:right}
.cline .art{background:none;border:0;padding:0;cursor:pointer;font:600 inherit/1.4 Inter,sans-serif;color:var(--ink);text-align:left;text-decoration:underline;text-decoration-color:rgba(217,166,90,.45);text-underline-offset:3px}
.drow .th{position:relative}.drow .th img{position:absolute;inset:0}
/* Statistiche: nome intero (va a capo se serve), barra più corta */
.grow{grid-template-columns:minmax(0,1fr) 64px 28px;gap:10px}
.grow .y{white-space:normal;overflow:visible;text-overflow:clip;line-height:1.25;overflow-wrap:anywhere}
.grow .track{height:8px}
.stat-mini + .grp{margin-top:16px}
.pphoto{margin-top:6px}.pphoto .aphoto{width:46%;max-width:200px}
</style>
</head>
<body>
<header>
  <div class="htitle">
    <button class="iconbtn back" id="backBtn" aria-label="Indietro" hidden>‹</button>
    <div>
      <h1 id="homeLink">Videoteca</h1>
      <div class="sub" id="sub">&nbsp;</div>
    </div>
  </div>
  <div class="hbtns"><button class="iconbtn" id="menuBtn" aria-label="Menu">⋯</button><button class="btn" id="addBtn" hidden>+ Aggiungi film</button></div>
</header>

<section id="viewHome" class="home">
  <div id="homeBanner"></div>
  <button class="card" id="goColl">
    <div class="card-art" id="homeColl"></div>
    <div class="card-body"><div class="card-title">Collezione</div><div class="card-sub" id="homeCollSub"></div></div>
    <span class="chev">›</span>
  </button>
  <button class="card" id="goWish">
    <div class="card-art" id="homeWish"></div>
    <div class="card-body"><div class="card-title">Da trovare</div><div class="card-sub" id="homeWishSub"></div></div>
    <span class="chev">›</span>
  </button>
  <button class="card" id="goStats">
    <div class="card-art pie"><svg viewBox="0 0 96 84" width="100%" height="100%" aria-hidden="true"><circle cx="48" cy="42" r="34" fill="#0b0b0b"/><path d="M48 42 L48 8 A34 34 0 0 1 80.3 52.5 Z" fill="#d9a65a"/><path d="M48 42 L80.3 52.5 A34 34 0 0 1 30 70.8 Z" fill="#9e5a2e"/><path d="M48 42 L30 70.8 A34 34 0 0 1 16 30 Z" fill="#2f6fc4"/><circle cx="48" cy="42" r="34" fill="none" stroke="#100c09" stroke-width="1"/><circle cx="48" cy="42" r="9" fill="#16120f"/><circle cx="48" cy="42" r="2" fill="#d9a65a"/></svg></div>
    <div class="card-body"><div class="card-title">Statistiche</div><div class="card-sub" id="homeStatsSub"></div></div>
    <span class="chev">›</span>
  </button>
  <footer class="credits" id="credits"></footer>
</section>

<section id="viewColl" class="wrap" hidden>
  <div class="controls">
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input class="field" id="q" type="search" placeholder="Cerca titolo, regista o attore" autocomplete="off">
    </div>
    <div class="filters">
      <select class="field" id="dirSel"><option value="">Registi</option></select>
      <select class="field" id="genreSel"><option value="">Generi</option></select>
      <select class="field" id="yearSel"><option value="">Anni</option></select>
      <button type="button" class="clearf" id="clearFilters">Cancella filtri</button>
    </div>
  </div>
  <div class="viewtoggle" id="viewToggle"><button data-m="spine">Costine</button><button data-m="cover">Locandine</button></div>
  <div class="letters" id="letters"></div>
  <div id="collMain"></div>
</section>

<section id="viewPerson" class="wrap" hidden></section>
<section id="viewStats" class="wrap" hidden></section>

<section id="viewLists" class="wrap" hidden>
  <div class="controls">
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input class="field" id="lq" type="search" placeholder="Cerca titolo o regista" autocomplete="off">
    </div>
  </div>
  <div class="viewtoggle" id="listToggle"><button data-m="spine">Costine</button><button data-m="cover">Locandine</button></div>
  <div id="listsMain"></div>
</section>

<!-- Modifica film -->
<div class="overlay" id="formOv" hidden>
  <form class="sheet" id="form" novalidate>
    <h3 id="formTitle">Nuovo film</h3>
    <label>Locandina</label>
    <div class="fcover">
      <div class="fcover-prev" id="fCoverPrev"></div>
      <div class="fcover-acts">
        <button type="button" class="btn ghost small" id="fSearch">Cerca online</button>
        <button type="button" class="btn ghost small" id="fPhoto">Carica foto</button>
        <button type="button" class="btn ghost small" id="fCoverDel">Togli locandina</button>
      </div>
    </div>
    <div class="hint" id="fHint"></div>
    <div class="picks" id="fPicks"></div>
    <label for="fTitle">Titolo</label>
    <input class="field" id="fTitle" autocomplete="off">
    <label for="fOrig">Titolo originale</label>
    <input class="field" id="fOrig" autocomplete="off" placeholder="Se diverso da quello italiano">
    <label for="fDir">Regia</label>
    <div class="acwrap">
      <input class="field" id="fDir" autocomplete="off" autocapitalize="words" style="padding-right:44px" placeholder="Più registi separati da virgola">
      <button type="button" class="acbtn" id="fDirBtn" aria-label="Scegli tra i registi">▾</button>
      <div class="acbox" id="fDirAc" hidden></div>
    </div>
    <div class="row2">
      <div><label for="fYear">Data di uscita</label><input class="field" id="fYear" type="text" autocomplete="off" placeholder="1999 o 31-03-1999"></div>
      <div><label for="fRuntime">Durata (minuti)</label><input class="field" id="fRuntime" type="text" inputmode="numeric" autocomplete="off" placeholder="Es. 136"></div>
    </div>
    <label>Voto</label>
    <div class="stars" id="fStars"></div>
    <label>Genere</label>
    <div class="gsel" id="fGenres"></div>
    <div style="display:flex;gap:8px;margin-top:8px">
      <select class="field" id="fGenreSel" style="flex:1"></select>
      <button type="button" class="btn ghost small" id="fGenreMgr">Modifica</button>
    </div>

<script>
(() => {
const APP_VERSION = "2.5";
const PALETTE = ["#1f1d1b","#7a2e2a","#23395b","#2f4a3a","#c49a3a","#e6d9bd","#2c5d63","#5a3550","#a2512b","#6b7b8c","#6b6a3a","#8c2f4b","#3d3a6b","#b8b2a3","#45604d","#9b6b43"];
const FORMATS = ["Blu-ray", "4K Ultra HD", "4K + Blu-ray", "Blu-ray 3D", "DVD"];
const KEY = "videoteca.films.v1", META_KEY = "videoteca.meta.v1";
const state = { person: null, personReturn: null, statsSub: null, statsOpen: null, mode: "spine", films: [], view: "home", q: "", genre: "", year: "", fdir: "", lq: "", rq: "", newId: null, editing: null, formList: null, fgenres: [], color: "", pending: null, rating: 0 };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
function hash(s){ let h = 2166136261; for (const ch of s){ h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function lum(hex){ const n = parseInt(hex.slice(1),16); return (0.299*((n>>16)&255)+0.587*((n>>8)&255)+0.114*(n&255))/255; }
const plural = (n, one, many) => n + " " + (n === 1 ? one : many);
const nFilm = n => plural(n, "film", "film");

/* ---------- Dati ---------- */
function load(){ try { const v = JSON.parse(localStorage.getItem(KEY)); return Array.isArray(v) ? v : []; } catch(e){ return []; } }
function getMeta(){ try { return JSON.parse(localStorage.getItem(META_KEY)) || {}; } catch(e){ return {}; } }
function setMeta(k, v){ try { const m = getMeta(); if (v === null) delete m[k]; else m[k] = v; localStorage.setItem(META_KEY, JSON.stringify(m)); } catch(e){} }
function persist(){ try { localStorage.setItem(KEY, JSON.stringify(state.films)); } catch(e){ throw { code: "storage" }; } setMeta("lastChangeAt", new Date().toISOString()); }
function errText(e){ return e && e.code === "storage" ? "Non riesco a salvare sul dispositivo (memoria piena?)." : "Salvataggio non riuscito, riprova."; }
const collection = () => state.films.filter(d => !d.list);
const listOf = k => state.films.filter(d => d.list === k).sort((a,b) => String(a.createdAt||"").localeCompare(String(b.createdAt||"")));
const sortName = a => norm(String(a || "").trim()).replace(/^[^a-z0-9]+/, "");
function letterOf(d){ const c = sortName(d.title).charAt(0).toUpperCase(); return /[A-Z]/.test(c) ? c : "#"; }
function filmSort(a, b){ return sortName(a.title).localeCompare(sortName(b.title), "it", { numeric: true }) || (Number(a.year)||9999) - (Number(b.year)||9999); }
const dirs = d => Array.isArray(d.directors) ? d.directors.filter(Boolean) : [];
const dirStr = d => dirs(d).join(", ");
// Cast: una riga per attore, "Attore — Personaggio"
// Cognome: ultima parola, con le particelle (De Niro, Van Damme, Di Caprio) e senza Jr./III
const PARTICLES = new Set(["da","de","del","della","dei","di","du","van","von","der","den","le","la","st.","mac","dos","das"]);
function splitName(n){
  const t = String(n || "").trim().split(/\s+/); if (t.length < 2) return { first: "", last: t[0] || "" };
  let end = t.length; const suff = [];
  while (end > 1 && /^(jr\.?|sr\.?|ii|iii|iv)$/i.test(t[end - 1].replace(/,$/, ""))) suff.unshift(t[--end]);
  let i = end - 1; while (i > 1 && PARTICLES.has(t[i - 1].toLowerCase())) i--;
  return { first: t.slice(0, i).join(" "), last: t.slice(i, end).join(" ") + (suff.length ? " " + suff.join(" ") : "") };
}
const surnameFirst = n => { const p = splitName(n); return p.first ? `${p.last} ${p.first}` : p.last; };
const pn = n => esc(surnameFirst(n));
const dirsShown = d => dirs(d).map(surnameFirst).join(", ");
const surnameSort = (a, b) => sortName(surnameFirst(a)).localeCompare(sortName(surnameFirst(b)), "it");
const castRows = d => String(d.cast || "").split("\n").map(l => l.trim()).filter(Boolean).map(l => { const [a, ...c] = l.split(/\s+[—–-]\s+/); return { actor: a.trim(), role: c.join(" – ").trim() }; });
const pkey = a => norm(String(a || "").trim());
function extraGenres(){ const x = getMeta().genresExtra; return Array.isArray(x) ? x.filter(g => typeof g === "string" && g) : []; }
function allGenres(){ const s = new Set(extraGenres()); for (const d of state.films) for (const g of d.genres || []) s.add(g); return [...s].sort((a,b) => a.localeCompare(b, "it")); }
function genreCount(g){ return state.films.filter(d => (d.genres || []).includes(g)).length; }
function fmtRuntime(m){ m = Number(m) || 0; if (!m) return ""; const h = Math.floor(m / 60), r = m % 60; return h ? `${h} h${r ? " " + r + " min" : ""}` : `${r} min`; }
function parseRuntime(v){
  v = String(v || "").trim().toLowerCase(); if (!v) return null;
  let m = v.match(/^(\d{1,2})\s*(?:h|ore|ora|:)\s*(\d{1,2})?\s*(?:m|min|minuti)?$/); if (m) return +m[1] * 60 + (+m[2] || 0);
  m = v.match(/^(\d{1,3})\s*(?:m|min|minuti|')?$/); if (m) return +m[1] || null;
  return undefined;
}
const ytId = v => { v = String(v || "").trim(); if (!v) return null; const m = v.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{6,})/) || v.match(/^([\w-]{6,})$/); return m ? m[1] : undefined; };
const imdbId = v => { v = String(v || "").trim(); if (!v) return null; const m = v.match(/(tt\d{5,})/i); return m ? m[1].toLowerCase() : undefined; };

/* ---------- Locandine (IndexedDB) ---------- */
const idb = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => { const r = indexedDB.open("videoteca", 1); r.onupgradeneeded = () => r.result.createObjectStore("covers"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }));
  const run = async (mode, fn) => { const db = await open(); return new Promise((res, rej) => { const t = db.transaction("covers", mode); const q = fn(t.objectStore("covers")); t.oncomplete = () => res(q ? q.result : undefined); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); }); };
  return { get: id => run("readonly", s => s.get(id)), set: (id, v) => run("readwrite", s => s.put(v, id)), del: id => run("readwrite", s => s.delete(id)) };
})();
const coverURLs = {};
async function coverSrc(d){
  if (d.coverLocal){
    if (coverURLs[d.id]) return coverURLs[d.id];
    try { const b = await idb.get(d.id); if (b){ coverURLs[d.id] = URL.createObjectURL(b); return coverURLs[d.id]; } } catch(e){}
  }
  return d.coverUrl || null;
}
function dropCover(id){ if (coverURLs[id]){ URL.revokeObjectURL(coverURLs[id]); delete coverURLs[id]; } }
// Foto della locandina: ritagliata in verticale (2:3), come una custodia
async function photoToBlob(file){
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const W = img.naturalWidth, H = img.naturalHeight;
    let cw = W, ch = H; if (W / H > 2 / 3) cw = H * 2 / 3; else ch = W * 1.5;
    const ow = Math.round(Math.min(600, cw)), oh = Math.round(ow * 1.5);
    const c = document.createElement("canvas"); c.width = ow; c.height = oh;
    c.getContext("2d").drawImage(img, (W - cw) / 2, (H - ch) / 2, cw, ch, 0, 0, ow, oh);
    return await new Promise(res => c.toBlob(res, "image/jpeg", 0.85));
  } finally { URL.revokeObjectURL(url); }
}
// Ricerca online: Apple TV / iTunes (locandina, anno, regista, genere, trama, durata)
async function itunes(params){ try { const r = await fetch("https://itunes.apple.com/search?country=it&" + params); if (!r.ok) return []; return (await r.json()).results || []; } catch(e){ return []; } }
async function searchFilms(term){
  const q = encodeURIComponent(term);
  const [mv, tv] = await Promise.all([itunes(`term=${q}&media=movie&entity=movie&limit=15`), itunes(`term=${q}&media=tvShow&entity=tvSeason&limit=6`)]);
  return [...mv, ...tv].filter(x => x.artworkUrl100).map(x => {
    const isTv = x.collectionType === "TV Season" || x.wrapperType === "collection";
    return { title: isTv ? x.collectionName : x.trackName, director: isTv ? null : (x.artistName || null), year: parseInt((x.releaseDate || "").slice(0,4), 10) || null,
      genre: x.primaryGenreName || null, summary: x.longDescription || x.description || null, runtime: x.trackTimeMillis ? Math.round(x.trackTimeMillis / 60000) : null, tv: isTv,
      art: x.artworkUrl100.replace(/\/\d+x\d+bb\./, "/600x900bb."), thumb: x.artworkUrl100.replace(/\/\d+x\d+bb\./, "/200x300bb.") };
  });
}
async function storeCoverFromUrl(id, url){
  dropCover(id);
  try { const r = await fetch(url, { mode: "cors" }); if (!r.ok) throw 0; const b = await r.blob(); if (!/^image\//.test(b.type)) throw 0; await idb.set(id, b); return { coverUrl: url, coverLocal: true }; }
  catch(e){ try { await idb.del(id); } catch(_){} const im = new Image(); im.src = url; return { coverUrl: url, coverLocal: false }; }
}

/* ---------- Costine ---------- */
const filmColor = d => d.color || PALETTE[hash((d.title || "") + "|" + (d.year || "")) % PALETTE.length];
function bandOf(d){ const f = d.format || "Blu-ray"; if (/^4K/.test(f)) return ["k4", "4K <i>ULTRA HD</i>"]; if (f === "DVD") return ["dvd", "DVD"]; if (/3D/.test(f)) return ["bd", "BD <i>3D</i>"]; return ["bd", "BD"]; }
function spineHTML(d, extra = ""){
  const color = filmColor(d), light = lum(color) > 0.6, [bc, bt] = bandOf(d);
  return `<button class="spine f-${bc} ${extra}" data-id="${esc(d.id)}" title="${esc(d.title)}${d.year ? " (" + d.year + ")" : ""}" style="--c:${color};--t:${light ? "#2a2018" : "#f4ead6"}"><span class="band">${bt}</span><span class="txt"><span class="ar">${esc(d.title)}</span></span><span class="foot">${d.year ? `<span>${d.year}</span>` : ""}</span></button>`;
}
const spineSpan = d => spineHTML(d).trim().replace(/^<button/, "<span").replace(/<\/button>$/, "</span>");
const BOX_SVG = `<svg class="disc" viewBox="0 0 100 100" aria-hidden="true"><path d="M18 38 L50 24 L82 38 L82 74 L50 88 L18 74 Z" fill="#b8874f"/><path d="M18 38 L50 52 L82 38 L50 24 Z" fill="#d9a65a"/><path d="M50 52 L50 88" stroke="#8a6332" stroke-width="2"/><path d="M34 31 L66 45" stroke="#e8d3a6" stroke-width="6" opacity=".8"/></svg>`;
const DISC_SVG = `<svg class="disc" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="48" fill="#cfd4dc"/>${[42,35,28].map(r => `<circle cx="50" cy="50" r="${r}" fill="none" stroke="#aab2be" stroke-width="1"/>`).join("")}<circle cx="50" cy="50" r="17" fill="#2f6fc4"/><circle cx="50" cy="50" r="6" fill="#16120f"/><path d="M18 32 A36 36 0 0 1 40 15" stroke="#fff" stroke-opacity=".7" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M80 66 A36 36 0 0 1 64 82" stroke="#9fd0ff" stroke-opacity=".6" stroke-width="3" fill="none" stroke-linecap="round"/></svg>`;
// Rimpicciolisce il testo di ogni costina finché il titolo ci sta intero
function fitSpines(root){
  for (const t of root.querySelectorAll(".spine .txt")){
    if (t.dataset.fit) continue;
    const box = t.parentNode, cs = getComputedStyle(box);
    const H = box.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom), W = box.clientWidth - 2;
    let fs = parseFloat(getComputedStyle(t).fontSize), guard = 0;
    while ((t.scrollHeight > H || t.scrollWidth > W) && fs > 4.5 && guard++ < 40){ fs -= 0.5; t.style.fontSize = fs + "px"; }
    t.dataset.fit = "1";
  }
}
function coverItemHTML(d){
  const col = filmColor(d);
  const img = d.coverUrl && !d.coverLocal ? `<img src="${esc(d.coverUrl)}" alt="" loading="lazy" onerror="this.remove()">` : "";
  return `<button class="citem" data-id="${esc(d.id)}"><div class="cimg" data-local="${d.coverLocal ? 1 : ""}" style="--c:${col};--t:${lum(col) > .6 ? "#2a2018" : "#f4ead6"}"><div class="ph">${esc(d.title)}</div>${img}</div><b>${esc(d.title)}</b><span>${[d.year, dirsShown(d)].filter(Boolean).map(esc).join(" · ")}</span></button>`;
}
function hydrateCovers(root){
  root.querySelectorAll('.cimg[data-local="1"]').forEach(async el => {
    const d = state.films.find(x => x.id === el.parentNode.dataset.id); const src = d && await coverSrc(d);
    if (src) el.insertAdjacentHTML("beforeend", `<img src="${esc(src)}" alt="" onerror="this.remove()">`);
  });
}

/* ---------- Pagine ---------- */
const VIEWS = ["home","collezione","wishlist","regista","statistiche"];
function showView(v, push = true){
  if (!VIEWS.includes(v)) v = "home";
  if (v === "regista" && !state.person) v = "home";
  if (state.view !== v){ state.lq = ""; $("lq").value = ""; }
  state.view = v;
  document.documentElement.classList.toggle("homeview", v === "home");
  $("viewHome").hidden = v !== "home"; $("viewColl").hidden = v !== "collezione"; $("viewLists").hidden = v !== "wishlist";
  $("viewPerson").hidden = v !== "regista"; $("viewStats").hidden = v !== "statistiche";
  $("backBtn").hidden = v === "home"; $("addBtn").hidden = !["collezione","wishlist"].includes(v);
  if (push){ const h = v === "home" ? "" : "#" + v; if (location.hash !== h) history.pushState(null, "", h || location.pathname); }
  window.scrollTo(0, 0); render();
}
window.addEventListener("popstate", () => showView((location.hash || "").slice(1), false));
$("goColl").onclick = () => showView("collezione");
$("goWish").onclick = () => showView("wishlist");
$("goStats").onclick = () => { state.statsSub = null; state.statsOpen = null; showView("statistiche"); };
$("backBtn").onclick = () => {
  if (state.view === "regista" && state.personReturn) return goBackFromPerson();
  if (state.view === "statistiche" && state.statsSub) return statsUp();
  showView("home");
};
$("homeLink").onclick = () => { state.personReturn = null; showView("home"); };
$("addBtn").onclick = () => openForm(null, state.view === "wishlist" ? "wish" : null);

function render(){
  const coll = collection();
  $("sub").textContent = coll.length ? `${nFilm(coll.length)} in collezione` : "La videoteca ti aspetta";
  renderHome(); renderColl(); renderLists();
  if (state.view === "regista") renderPerson();
  if (state.view === "statistiche") renderStats();
}
function renderHome(){
  const coll = collection().sort(filmSort), wish = listOf("wish");
  const deco = PALETTE.slice(0, 11).map((c, i) => ({ id: "d" + i, title: "", color: c }));
  const mini = arr => arr.map(d => `<div style="--row:78px;--s:.32">${spineSpan(d)}</div>`).join("");
  $("homeColl").innerHTML = mini(coll.length ? coll.slice(0, 13) : deco);
  $("homeCollSub").textContent = coll.length ? nFilm(coll.length) : "Aggiungi il tuo primo film";
  $("homeWish").innerHTML = mini([...wish, ...deco].slice(0, 8)) + DISC_SVG;
  $("homeWishSub").textContent = wish.length ? `${nFilm(wish.length)} da cercare` : "I film che stai cercando";
  const mins = coll.reduce((s, d) => s + (Number(d.runtime) || 0), 0);
  $("homeStatsSub").textContent = mins ? `${Math.round(mins / 60)} ore di film sugli scaffali` : "Generi, registi, anni";
  $("homeBanner").innerHTML = bannerHTML();
}
function matchQ(d, q){ if (!q) return true; q = norm(q); return norm(d.title).includes(q) || norm(d.originalTitle).includes(q) || norm(dirStr(d)).includes(q) || norm(dirsShown(d)).includes(q) || norm(d.cast).includes(q) || castRows(d).some(c => norm(surnameFirst(c.actor)).includes(q)) || (d.genres || []).some(g => norm(g).includes(q)); }
function renderColl(){
  const all = collection();
  const directors = [...new Set(all.flatMap(dirs))].sort(surnameSort);
  if (state.fdir && !directors.includes(state.fdir)) state.fdir = "";
  $("dirSel").innerHTML = `<option value="">Registi</option>` + directors.map(a => `<option value="${esc(a)}" ${a === state.fdir ? "selected" : ""}>${esc(surnameFirst(a))}</option>`).join("");
  const genres = allGenres();
  if (state.genre && !genres.includes(state.genre)) state.genre = "";
  $("genreSel").innerHTML = `<option value="">Generi</option>` + genres.map(g => `<option ${g === state.genre ? "selected" : ""}>${esc(g)}</option>`).join("");
  const years = [...new Set(all.map(d => d.year).filter(Boolean))].sort((a,b) => b - a);
  if (state.year && !years.includes(Number(state.year))) state.year = "";
  $("yearSel").innerHTML = `<option value="">Anni</option>` + years.map(y => `<option value="${y}" ${String(y) === String(state.year) ? "selected" : ""}>${y}</option>`).join("");
  const filtered = !!(state.q || state.fdir || state.genre || state.year);
  $("clearFilters").disabled = !filtered;
  const list = all.filter(d => matchQ(d, state.q) && (!state.fdir || dirs(d).includes(state.fdir)) && (!state.genre || (d.genres || []).includes(state.genre)) && (!state.year || String(d.year) === String(state.year))).sort(filmSort);
  const present = new Set(list.map(letterOf));
  $("letters").innerHTML = "#ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").map(l => `<button data-l="${l}" ${present.has(l) ? "" : "disabled"}>${l}</button>`).join("");
  $("letters").hidden = list.length < 15;
  document.querySelectorAll("#viewToggle button").forEach(b => b.classList.toggle("on", b.dataset.m === state.mode));
  if (!all.length){
    $("collMain").innerHTML = `<div class="welcome"><h2>La tua videoteca</h2><p>Aggiungi il primo film, oppure importa il backup con i tuoi Blu-ray. Gli scaffali si ordinano da soli in ordine alfabetico per titolo.</p><div class="actions"><button class="btn ghost" id="wImport">Importa backup</button><button class="btn" id="wAdd">Aggiungi film</button></div></div>`;
    return;
  }
  if (!list.length){ $("collMain").innerHTML = `<p class="nores">Nessun film corrisponde alla ricerca</p>`; return; }
  const countTxt = filtered ? `${list.length} di ${all.length}` : nFilm(all.length);
  if (state.mode === "cover"){
    let g = "", lastL = null;
    for (const d of list){ const l = letterOf(d); if (l !== lastL){ g += `<div class="cletter" id="L-${l}">${l}</div>`; lastL = l; } g += coverItemHTML(d); }
    $("collMain").innerHTML = `<div class="sechead"><h2>Collezione</h2><span>${countTxt}</span></div><div class="cgrid">${g}</div>`;
    hydrateCovers($("collMain")); state.newId = null; return;
  }
  let html = "", last = null;
  for (const d of list){
    const l = letterOf(d);
    if (l !== last){ html += `${last === null ? "" : "</div>"}<div class="shelf" id="L-${l}"><div class="slot"><div class="divider"><b>${l}</b></div></div>`; last = l; }
    html += `<div class="slot">${spineHTML(d, d.id === state.newId ? "new" : "")}</div>`;
  }
  html += "</div>";
  $("collMain").innerHTML = `<div class="sechead"><h2>Collezione</h2><span>${countTxt}</span></div><div class="case">${html}</div>`;
  requestAnimationFrame(() => fitSpines($("collMain")));
  state.newId = null;

/* ---------- Foto dei registi: Wikipedia ---------- */
const FILM_RE = /\b(director|filmmaker|film|films|actor|actress|screenwriter|producer|animator|animation|cinematographer|comedian)\b|regista|attore|attrice|sceneggiatore|produttore|animatore|fumettista|cinematografic/i;
async function wikiPages(lang, params, size = 1000){
  const u = `https://${lang}.wikipedia.org/w/api.php?action=query&format=json&origin=*&redirects=1&prop=pageimages|description&piprop=thumbnail&pithumbsize=${size}&` + params;
  const r = await fetch(u); if (!r.ok) throw 0;
  const j = await r.json(); return Object.values(j.query?.pages || {}).filter(p => !("missing" in p));
}
// quick = per la ricerca automatica: foto più piccola e si ferma alla prima lingua che trova qualcosa
async function wikiCandidates(name, quick){
  const out = [];
  for (const lang of ["en", "it"]){
    const suff = lang === "en" ? ["actor", "actress", "director", "filmmaker"] : ["attore", "attrice", "regista"];
    try {
      const pages = await wikiPages(lang, "titles=" + encodeURIComponent([name, ...suff.map(x => `${name} (${x})`)].join("|")), quick ? 500 : 1000);
      for (const p of pages) if (p.thumbnail && FILM_RE.test(p.description || "") && !out.some(o => o.src === p.thumbnail.source)) out.push({ src: p.thumbnail.source, thumb: p.thumbnail.source, label: p.title, from: "Wikipedia " + lang.toUpperCase() });
    } catch(e){}
    if (quick && out.length) break;
  }
  return out;
}
/* TMDB (serve la chiave personale gratuita) */
const tmdbKey = () => (getMeta().tmdbKey || "").trim();
async function tmdbGet(path, key = tmdbKey()){
  const bearer = key.length > 60;
  const r = await fetch("https://api.themoviedb.org/3" + path + (bearer ? "" : (path.includes("?") ? "&" : "?") + "api_key=" + encodeURIComponent(key)), bearer ? { headers: { Authorization: "Bearer " + key } } : {});
  if (!r.ok) throw { status: r.status };
  return r.json();
}
async function tmdbCandidates(name, quick){
  if (!tmdbKey()) return [];
  try {
    const j = await tmdbGet("/search/person?language=it-IT&query=" + encodeURIComponent(name));
    const nk = tkey(name);
    let list = (j.results || []).filter(p => p.profile_path);
    const exact = list.filter(p => tkey(p.name) === nk || tkey(p.original_name) === nk).sort((a, b) => (b.popularity || 0) - (a.popularity || 0));
    if (quick) list = exact.slice(0, 1); else list = [...exact, ...list.filter(p => !exact.includes(p))].slice(0, 6);
    return list.map(p => ({ src: "https://image.tmdb.org/t/p/w500" + p.profile_path, thumb: "https://image.tmdb.org/t/p/w185" + p.profile_path, label: p.name + (p.known_for_department === "Directing" ? " (regia)" : ""), from: "TMDB" }));
  } catch(e){ return []; }
}
/* Wikidata: foto anche di persone senza pagina Wikipedia con immagine */
async function wikidataCandidates(name, quick){
  try {
    const s1 = await (await fetch("https://www.wikidata.org/w/api.php?action=wbsearchentities&format=json&origin=*&type=item&limit=6&language=en&uselang=it&search=" + encodeURIComponent(name))).json();
    const hits = (s1.search || []).filter(h => tkey(h.label) === tkey(name) && FILM_RE.test(h.description || ""));
    if (!hits.length) return [];
    const ents = (await (await fetch("https://www.wikidata.org/w/api.php?action=wbgetentities&format=json&origin=*&props=claims&ids=" + hits.map(h => h.id).join("|"))).json()).entities || {};
    const files = hits.map(h => ents[h.id]?.claims?.P18?.[0]?.mainsnak?.datavalue?.value).filter(Boolean).slice(0, quick ? 1 : 3);
    if (!files.length) return [];
    const ii = await (await fetch("https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&prop=imageinfo&iiprop=url&iiurlwidth=" + (quick ? 500 : 1000) + "&titles=" + encodeURIComponent(files.map(f => "File:" + f).join("|")))).json();
    return Object.values(ii.query?.pages || {}).map(p => p.imageinfo?.[0]?.thumburl).filter(Boolean).map(u => ({ src: u, thumb: u, label: name, from: "Wikidata" }));
  } catch(e){ return []; }
}
async function imageUrlToBlob(src, max = 1000){
  const r = await fetch(src, { mode: "cors" }); if (!r.ok) throw 0;
  const b = await r.blob(); const url = URL.createObjectURL(b);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight)); const c = document.createElement("canvas");
    c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return await new Promise(res => c.toBlob(res, "image/jpeg", max < 1000 ? 0.8 : 0.88));
  } finally { URL.revokeObjectURL(url); }
}
// Dove sta la foto di un regista: nel dispositivo (blob) oppure come indirizzo web.
function personUrlMap(){ return getMeta().personPhotoUrls || {}; }
function personAutoMap(){ return getMeta().personAuto || {}; }
async function personHasPhoto(k){ try { if (await idb.get("person:" + k)) return true; } catch(e){} return !!personUrlMap()[k]; }
// "Automatica" = scaricata dall'app e non scelta da te: solo queste possono essere sostituite in automatico.
const personPhotoIsAuto = async k => !!personAutoMap()[k];
function setPersonFlags(k, auto){
  const m = getMeta(); const a = { ...(m.personAuto || {}) }, man = { ...(m.personManual || {}) };
  if (auto){ a[k] = true; delete man[k]; } else { delete a[k]; man[k] = true; }
  setMeta("personAuto", a); setMeta("personManual", man);
}
function dropPersonURL(key){ if (pPhotoURLs[key]){ if (pPhotoURLs[key].startsWith("blob:")) URL.revokeObjectURL(pPhotoURLs[key]); delete pPhotoURLs[key]; } }
async function savePersonPhoto(name, src, auto){
  const k = pkey(name), key = "person:" + k;
  const urls = { ...personUrlMap() };
  try { const blob = await imageUrlToBlob(src, auto ? 500 : 1000); if (!blob) throw 0; await idb.set(key, blob); delete urls[k]; }
  catch(e){ try { await idb.del(key); } catch(_){} urls[k] = src; }
  setMeta("personPhotoUrls", urls); setPersonFlags(k, auto); if (getChoices()[k]) setChoice(k, null);
  setMeta("personPhotoSrc", { ...(getMeta().personPhotoSrc || {}), [k]: src });
  dropPersonURL(key);
  setMeta("lastChangeAt", new Date().toISOString());
}
// Raccoglie le foto candidate da tutte le fonti, senza doppioni
async function allCandidates(name, quick){
  const [tm, wk] = await Promise.all([tmdbCandidates(name, quick), wikiCandidates(name, true)]);
  const wd = await wikidataCandidates(name, true);
  const seen = new Set(), out = [];
  for (const c of [...tm, ...wk, ...wd]){ const f = decodeURIComponent(c.src.split("/").pop()).replace(/^\d+px-/, ""); if (seen.has(f)) continue; seen.add(f); out.push(c); }
  return out;
}
// Una sola foto: la metto. Più foto: le lascio da scegliere a te.
async function autoPersonPhoto(name){
  const k = pkey(name);
  if (await personHasPhoto(k)) return "had";
  const list = await allCandidates(name, true);
  if (!list.length) return "none";
  if (list.length === 1){ await savePersonPhoto(name, list[0].src, true); return "new"; }
  setChoice(k, { name, cands: list.slice(0, 6).map(c => ({ src: c.src, thumb: c.thumb, from: c.from })) });
  return "choose";
}
const getChoices = () => getMeta().photoChoices || {};
function setChoice(k, v){ const m = { ...getChoices() }; if (v) m[k] = v; else delete m[k]; setMeta("photoChoices", Object.keys(m).length ? m : null); }
// Tutte le persone dei film: registi e attori del cast, senza doppioni
function allPeople(){

  for (const d of state.films) for (const n of [...dirs(d), ...castRows(d).map(c => c.actor)]){ const k = pkey(n); if (k && !m.has(k)) m.set(k, n.trim()); }
  return [...m.values()].sort((a, b) => a.localeCompare(b, "it"));
}

  state.films = state.films.map(d => {
    let ch = false;
    const ds = dirs(d).map(x => { if (pkey(x) === ok){ ch = true; return newName; } return x; });

    return { ...d, directors: [...new Set(ds)], cast };
  });

    const o = m[f]; if (!o || !(ok in o)) continue;

}

/* ---------- Biografia: Wikipedia italiana, poi TMDB, poi Wikipedia inglese ---------- */
async function wikiBio(name, lang){
  const suff = lang === "it" ? ["attore", "attrice", "regista"] : ["actor", "actress", "director", "filmmaker"];
  const u = `https://${lang}.wikipedia.org/w/api.php?action=query&format=json&origin=*&redirects=1&prop=extracts|description|pageprops&exintro=1&explaintext=1&exlimit=max&titles=` + encodeURIComponent([name, ...suff.map(x => `${name} (${x})`)].join("|"));
  const j = await (await fetch(u)).json();
  const p = Object.values(j.query?.pages || {}).find(p => !("missing" in p) && !(p.pageprops && "disambiguation" in p.pageprops) && FILM_RE.test(p.description || "") && (p.extract || "").trim().length > 40);
  return p ? { text: p.extract.trim().replace(/\n{2,}/g, "\n\n"), from: "Wikipedia" + (lang === "it" ? "" : " (inglese)") } : null;
}
async function tmdbBio(name){
  if (!tmdbKey()) return null;
  const j = await tmdbGet("/search/person?language=it-IT&query=" + encodeURIComponent(name));
  const nk = tkey(name);
  const p = (j.results || []).filter(p => tkey(p.name) === nk || tkey(p.original_name) === nk).sort((a, b) => (b.popularity || 0) - (a.popularity || 0))[0];
  if (!p) return null;
  const it = await tmdbGet(`/person/${p.id}?language=it-IT`);
  if ((it.biography || "").trim().length > 40) return { text: it.biography.trim(), from: "TMDB" };
  return null;
}
// Tiene l'introduzione: al massimo circa 1500 caratteri, tagliando tra un paragrafo e l'altro
function trimBio(t){
  t = String(t || "").trim(); if (t.length <= 1500) return t;
  const ps = t.split(/\n+/); let out = "";
  for (const p of ps){ if (out && (out + "\n\n" + p).length > 1500) break; out = out ? out + "\n\n" + p : p; }
  return out.length > 1500 ? out.slice(0, out.lastIndexOf(". ", 1500) + 1 || 1500) : out;
}

const tkey = s => norm(s).replace(/[^a-z0-9]+/g, "");
function bestMatch(d, res){
  const t = tkey(d.title), o = tkey(d.originalTitle), y = Number(d.year) || 0;
  const okY = r => !y || !r.year || Math.abs(r.year - y) <= 1;
  const same = r => { const k = tkey(r.title); return k === t || (o && k === o) || (t.length > 5 && (k.startsWith(t) || t.startsWith(k))); };
  return res.find(r => same(r) && okY(r) && !!r.tv === (d.kind === "tv")) || res.find(r => same(r) && okY(r)) || null;
}

/* ---------- Statistiche ---------- */
function groups(kind){
  const m = new Map();
  for (const d of collection()){
    let keys;
    if (kind === "genere") keys = (d.genres && d.genres.length) ? d.genres : ["Senza genere"];
    else if (kind === "regista") keys = dirs(d).length ? dirs(d) : ["Regia non indicata"];
    else if (kind === "attore"){ keys = [...new Set(castRows(d).map(c => c.actor))]; if (!keys.length) keys = ["Cast non indicato"]; }
    else if (kind === "anno") keys = [d.year ? String(d.year) : "Anno sconosciuto"];
    else if (kind === "decennio") keys = [d.year ? `Anni ${Math.floor(d.year / 10) * 10}` : "Anno sconosciuto"];
    else if (kind === "voto") keys = [Number(d.rating) > 0 ? String(Math.round(Number(d.rating) * 2) / 2) : "Senza voto"];
    else keys = [d.format || "Blu-ray"];
    for (const k of keys){ const kk = kind === "regista" || kind === "attore" ? pkey(k) : k; if (!m.has(kk)) m.set(kk, { label: k, items: [] }); m.get(kk).items.push(d); }
  }
  const arr = [...m.entries()].map(([key, v]) => ({ key, label: v.label, items: v.items.sort(filmSort) }));
  if (kind === "anno") return arr.sort((a,b) => (a.label === "Anno sconosciuto") - (b.label === "Anno sconosciuto") || Number(a.label) - Number(b.label));
  if (kind === "decennio") return arr.sort((a,b) => a.label.localeCompare(b.label));
  if (kind === "voto") return arr.sort((a,b) => (a.key === "Senza voto") - (b.key === "Senza voto") || Number(b.key) - Number(a.key));
  if ((kind === "regista" || kind === "attore") && getMeta().personSort === "alfa") return arr.sort((a,b) => (/^(Regia non|Cast non)/.test(a.label) - /^(Regia non|Cast non)/.test(b.label)) || surnameSort(a.label, b.label));
  return arr.sort((a,b) => (/^(Senza|Regia non|Cast non)/.test(a.label) - /^(Senza|Regia non|Cast non)/.test(b.label)) || (b.items.length - a.items.length) || a.label.localeCompare(b.label, "it"));
}

function parseRelease(v){

async function prepareBackup(progress){

        if (auto && srcs[k]) urls[k] = srcs[k];
